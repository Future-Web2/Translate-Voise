[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-uzbek-voicebot"
version = "0.1.0"
description = "Private Telegram transcription, Uzbek translation and io.net questions"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiogram>=3.22,<4",
  "aiohttp>=3.10,<4",
  "httpx>=0.28,<0.29",
  "python-dotenv>=1.0,<2",
  "faster-whisper>=1.2.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
voicebot = "voicebot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", ".python", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
